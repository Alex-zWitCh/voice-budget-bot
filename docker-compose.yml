version: "3.8"

services:
  voice-budget-bot:
    build: .
    container_name: voice-budget-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3, os; sqlite3.connect(os.getenv('SQLITE_DB_PATH', '/data/voice_budget_bot.db')).execute('select 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
